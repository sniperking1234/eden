name: Sync upstream branches

on:
  schedule:
    - cron: "30 18 * * *"   # 每天 UTC 18:30（北京时间次日凌晨 2:30）运行
  workflow_dispatch: {}      # 也支持在 Actions 页面手动触发

concurrency:
  group: sync-upstream
  cancel-in-progress: false

# 内置 GITHUB_TOKEN 需要 Contents 写权限：下方"两步镜像"的第一步用它
# 推送分支/tag（它创建的推送事件永远不会触发任何 workflow）。
permissions:
  contents: write

jobs:
  sync:
    # 防止这个文件哪天被合进上游后、在上游仓库里误跑
    if: github.repository_owner != 'eden-emu'
    runs-on: ubuntu-latest
    # 首跑要搬运 14 个 release 共约 13.4 GB 附件（增量式，超时会续跑补齐）
    timeout-minutes: 350
    steps:
      # 关键：用带 Workflows 写权限的 PAT 检出并推送。
      # 内置 GITHUB_TOKEN 是 GitHub App token，GitHub 安全策略禁止它推送任何
      # 会创建/修改 .github/workflows/ 的提交——而下方"放回"步骤每次都会产生
      # 这样的提交、PAT 补推步骤也依赖 PAT，所以检出必须用 secret SYNC_TOKEN。
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0            # 必须拉全量历史，否则推送不了
          token: ${{ secrets.SYNC_TOKEN }}

      # master 会被镜像成上游版本，这个文件自己会"消失"，所以先备份
      - name: Back up this workflow file
        run: cp .github/workflows/sync-upstream.yml "$RUNNER_TEMP/sync.yml"

      # 本项目上游是自建 Gitea（git.eden-emu.dev/eden-emu/eden），不是 GitHub：
      # 匿名 HTTPS 直接 fetch，无需凭据。分支和 tag 一次取齐：之后的任何
      # push 前都不再 fetch——任何 fetch 都会重建 refs/remotes/upstream/HEAD
      # 符号引用，它会被 refspec 通配符匹配到、生成一个叫 HEAD 的垃圾分支
      # （踩坑 2）；--force 必须带上：上游可能把已发布的 tag 挪到别的提交
      # （踩坑 10）。
      - name: Fetch upstream
        run: |
          git remote -v | grep -q upstream || \
            git remote add upstream https://git.eden-emu.dev/eden-emu/eden.git
          git fetch --prune --tags --force upstream
          git remote set-head upstream --delete

      # 两步镜像（同其他项目，防触发继承来的上游 CI）：
      #   1) 先用内置 GITHUB_TOKEN 推：App token 产生的推送事件永不触发任何
      #      workflow（官方防递归行为）
      #   2) GITHUB_TOKEN 无 Workflows 权限，包含 .github/workflows 改动的 ref
      #      会被拒绝——届时已成功推上去的 ref 变为"up to date"，第 2 步 PAT
      #      重推只补剩下的 ref。
      # Eden 特况：上游 CI 全在 .forgejo/workflows（GitHub 不识别），master 上
      # 无 .github/workflows，无需预创建/禁用任何条目。但 20 个旧分支 tip 和
      # 旧 tag 指向的历史提交树里残留 .github/workflows——GITHUB_TOKEN 推不动
      # 它们（首推视为"创建" workflow 文件），PAT 补推产生真实 push 事件并按
      # 该 ref 树里的触发器求值：其中 on: 被整段注释的文件（= 无 on 键，GitHub
      # 默认 push 触发，见 README 踩坑 12）当场触发了 18 个秒失败 run，已删除
      #（2026-11-05 首跑实测 + 专项实验证实）。一次性事件：这些 ref 此后常驻
      # 不重推，日常零触发；残留仅当上游 re-tag 回旧式提交、或推进会改
      # .github/workflows 的分支时再现，属已知可接受风险。
      - name: Mirror all upstream branches (built-in token, no CI triggered)
        env:
          APP_TOKEN: ${{ github.token }}
        run: |
          git push --force "https://x-access-token:${APP_TOKEN}@github.com/$GITHUB_REPOSITORY.git" \
            'refs/remotes/upstream/*:refs/heads/*' || echo "(部分 ref 需 PAT 补推)"

      - name: Mirror all upstream tags (built-in token, no CI triggered)
        env:
          APP_TOKEN: ${{ github.token }}
        run: |
          # tag 已在 Fetch upstream 步骤取齐，这里只推不取；
          # 上游 re-tag 过的 tag 靠 --force 覆盖本仓库上的旧值
          git push --force "https://x-access-token:${APP_TOKEN}@github.com/$GITHUB_REPOSITORY.git" \
            --tags || echo "(部分 tag 需 PAT 补推)"

      # 第 2 步：PAT 补推内置 token 被拒的 ref（已推成功的是 up to date，自动
      # 跳过）。tag 只加不删——上游删掉的 tag 会留在本仓库上
      - name: Finish branch/tag mirror with PAT
        run: |
          git push --force origin 'refs/remotes/upstream/*:refs/heads/*'
          git push --force origin --tags

      # 镜像上游 release。上游是 Gitea：release 正文与附件清单走 Gitea API
      # （匿名可读）；附件本身是指向官方 CDN（stable.eden-emu.dev）的外部
      # 链接，共 14 个 release 约 13.4 GB、448 个文件——逐个下载再上传为本
      # 仓库的 release 资产。增量式：已存在的 release 不重建，只补缺失附件、
      # 跟随正文更新；单个附件下载/上传失败仅告警不中断，下次运行自动补齐。
      # 写本仓库用 SYNC_TOKEN（细粒度 PAT，Contents 写权限）。
      - name: Mirror upstream releases into this repo
        env:
          FORK_TOKEN: ${{ secrets.SYNC_TOKEN }}   # 写入本仓库
        run: |
          API='https://git.eden-emu.dev/api/v1/repos/eden-emu/eden/releases'
          FORK="$GITHUB_REPOSITORY"
          DIR="$RUNNER_TEMP/relmirror"
          mkdir -p "$DIR"

          mine() { GH_TOKEN="$FORK_TOKEN" gh "$@" --repo "$FORK"; }

          # 分页取齐上游 release（Gitea limit 上限 50），汇总成 JSON 数组，
          # 按 id 从旧到新处理（让本仓库的 Latest 徽章落在最新版）
          page=1
          : > "$DIR/raw.jsonl"
          while :; do
            out=$(curl -fsSL "$API?limit=50&page=$page") || { echo "上游 release 列表获取失败"; exit 1; }
            n=$(jq 'length' <<<"$out")
            [[ "$n" -eq 0 ]] && break
            jq -c '.[]' <<<"$out" >> "$DIR/raw.jsonl"
            page=$((page+1))
          done
          [[ -s "$DIR/raw.jsonl" ]] || { echo "上游无 release，跳过"; exit 0; }
          jq -s 'sort_by(.id)' "$DIR/raw.jsonl" > "$DIR/rels.json"

          total=$(jq 'length' "$DIR/rels.json")
          for ((i = 0; i < total; i++)); do
            tag=$(jq -r ".[$i].tag_name" "$DIR/rels.json")
            name=$(jq -r ".[$i].name" "$DIR/rels.json")
            is_pre=$(jq -r ".[$i].prerelease" "$DIR/rels.json")
            echo "== release $tag"

            fork_json=$(mine release view "$tag" --json body,assets 2>/dev/null || true)
            if [[ -z "$fork_json" ]]; then
              jq -r ".[$i].body" "$DIR/rels.json" > "$DIR/body.md"
              args=(--title "$name" --notes-file "$DIR/body.md" --verify-tag)
              [[ "$is_pre" == "true" ]] && args+=(--prerelease)
              mine release create "$tag" "${args[@]}"
              fork_json=$(mine release view "$tag" --json body,assets)
            else
              # 正文与上游不同则更新
              if [[ "$(jq -r .body <<<"$fork_json")" != "$(jq -r ".[$i].body" "$DIR/rels.json")" ]]; then
                jq -r ".[$i].body" "$DIR/rels.json" > "$DIR/body.md"
                mine release edit "$tag" --notes-file "$DIR/body.md" >/dev/null
              fi
            fi

            # 补缺失的资产（上游附件名 → 本仓库没有的）
            mapfile -t have < <(jq -r '.assets[].name' <<<"$fork_json")
            while IFS=$'\t' read -r aname aurl; do
              [[ -z "$aname" ]] && continue
              if printf '%s\n' "${have[@]}" | grep -qx "$aname"; then continue; fi
              echo "  asset $tag/$aname：下载并上传"
              if ! curl -fsSL --retry 3 -o "$DIR/$aname" "$aurl"; then
                echo "  !! 下载失败，跳过（下次运行会重试）"
                continue
              fi
              if ! mine release upload "$tag" "$DIR/$aname" --clobber; then
                echo "  !! 上传失败，跳过（下次运行会重试）"
              fi
              rm -f "$DIR/$aname"
            done < <(jq -r ".[$i].assets[] | [.name, .browser_download_url] | @tsv" "$DIR/rels.json")
          done

      # 镜像必然覆盖默认分支 master——把 workflow 文件放回并提交推送
      #（否则 master 被镜像后文件消失，定时任务会"自杀"）
      # mkdir -p 兜底上游分支不存在 .github/workflows 目录的情况
      #（bloodborne_pc 踩过，见 README 踩坑 5；上游 master 只有 .forgejo）
      - name: Put this workflow back on master
        run: |
          git checkout -f -B master upstream/master
          mkdir -p .github/workflows
          cp "$RUNNER_TEMP/sync.yml" .github/workflows/sync-upstream.yml
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/sync-upstream.yml
          git commit -m "chore: keep fork-sync workflow"
          # 放回推送加 3 次重试：GitHub 偶发无理由拒绝这次推送
          #（nxnative 2026-11-04 踩过：! [remote rejected] main -> main (failed)，
          #  无重试的放回失败 = 默认分支上没有 workflow 文件 = 条目被删 =
          #  定时任务死亡 6 天；见 README 踩坑 13）
          ok=0
          for attempt in 1 2 3; do
            if git push origin master; then ok=1; break; fi
            echo "!! 放回推送被拒（第 $attempt 次），15 秒后重试..."
            sleep 15
          done
          if [[ "$ok" -ne 1 ]]; then
            echo "!! 3 次均失败——定时任务已死，需手动重 PUT workflow（README 修改 workflow 的流程）"
            exit 1
          fi
